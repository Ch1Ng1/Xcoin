name: Update Price Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'

permissions:
  contents: write
  actions: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run update script
        env:
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
        run: python scripts/update_price_data.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add XCoinBlazor/wwwroot/data/
          git diff --cached --quiet || git commit -m "Update price data (monthly averages)"
          git push

      - name: Trigger docs build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run github-pages.yml --ref main
